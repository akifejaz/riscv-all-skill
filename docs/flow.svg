<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 415" width="1060" height="415" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1060" height="415" fill="#ffffff"/>

  <!-- legend -->
  <rect x="20" y="20" width="12" height="12" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
  <text x="38" y="30" font-size="11.5" fill="#222">no LLM</text>
  <rect x="110" y="20" width="12" height="12" fill="#cfe8f3" stroke="#2b6b83" stroke-width="1"/>
  <text x="128" y="30" font-size="11.5" fill="#222">LLM step</text>
  <rect x="210" y="20" width="12" height="12" fill="#fbe0c8" stroke="#b5651d" stroke-width="1"/>
  <text x="228" y="30" font-size="11.5" fill="#222">local cache</text>

  <!-- main row -->
  <rect x="20" y="165" width="120" height="60" rx="2" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
  <text x="80" y="200" text-anchor="middle" font-size="13" fill="#111">Your question</text>

  <line x1="140" y1="195" x2="168" y2="195" stroke="#222" stroke-width="1.3" marker-end="url(#arw)"/>

  <rect x="175" y="165" width="140" height="60" rx="2" fill="#cfe8f3" stroke="#2b6b83" stroke-width="1.2"/>
  <text x="245" y="190" text-anchor="middle" font-size="13" fill="#111">Route</text>
  <text x="245" y="208" text-anchor="middle" font-size="10.5" fill="#333">by question type</text>

  <line x1="315" y1="195" x2="341" y2="195" stroke="#222" stroke-width="1.3" marker-end="url(#arw)"/>

  <!-- source group -->
  <rect x="345" y="100" width="230" height="190" rx="2" fill="none" stroke="#777" stroke-width="1.1" stroke-dasharray="5,4"/>
  <text x="460" y="93" text-anchor="middle" font-size="10.5" fill="#555">one of three sources</text>

  <rect x="360" y="112" width="200" height="50" rx="2" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
  <text x="460" y="133" text-anchor="middle" font-size="12.5" fill="#111">UDB clone</text>
  <text x="460" y="149" text-anchor="middle" font-size="10.5" fill="#333">encodings, CSR fields</text>

  <rect x="360" y="172" width="200" height="50" rx="2" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
  <text x="460" y="193" text-anchor="middle" font-size="12.5" fill="#111">Ratification records</text>
  <text x="460" y="209" text-anchor="middle" font-size="10.5" fill="#333">index, wiki, preface table</text>

  <rect x="360" y="232" width="200" height="50" rx="2" fill="#fbe0c8" stroke="#b5651d" stroke-width="1.2"/>
  <text x="460" y="253" text-anchor="middle" font-size="12.5" fill="#111">Spec cache</text>
  <text x="460" y="269" text-anchor="middle" font-size="10.5" fill="#333">prose, SBI, psABI, AIA</text>

  <line x1="575" y1="195" x2="611" y2="195" stroke="#222" stroke-width="1.3" marker-end="url(#arw)"/>

  <rect x="615" y="165" width="150" height="60" rx="2" fill="#cfe8f3" stroke="#2b6b83" stroke-width="1.2"/>
  <text x="690" y="190" text-anchor="middle" font-size="13" fill="#111">Precedence check</text>
  <text x="690" y="208" text-anchor="middle" font-size="10.5" fill="#333">the ladder decides</text>

  <line x1="765" y1="195" x2="801" y2="195" stroke="#222" stroke-width="1.3" marker-end="url(#arw)"/>

  <rect x="805" y="165" width="210" height="60" rx="2" fill="#cfe8f3" stroke="#2b6b83" stroke-width="1.2"/>
  <text x="910" y="190" text-anchor="middle" font-size="13" fill="#111">Answer</text>
  <text x="910" y="208" text-anchor="middle" font-size="10.5" fill="#333">quote, versioned link, status</text>

  <!-- lower row -->
  <line x1="245" y1="225" x2="245" y2="324" stroke="#555" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arwd)"/>
  <text x="253" y="280" font-size="10" fill="#555">out of scope</text>
  <rect x="175" y="328" width="140" height="60" rx="2" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
  <text x="245" y="352" text-anchor="middle" font-size="12.5" fill="#111">Decline</text>
  <text x="245" y="369" text-anchor="middle" font-size="10.5" fill="#333">name a better source</text>

  <line x1="460" y1="328" x2="460" y2="286" stroke="#555" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arwd)"/>
  <text x="472" y="314" font-size="10" fill="#555">first question only</text>
  <rect x="360" y="328" width="200" height="60" rx="2" fill="#ffffff" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="460" y="352" text-anchor="middle" font-size="12.5" fill="#111">docs.riscv.org</text>
  <text x="460" y="369" text-anchor="middle" font-size="10.5" fill="#333">versioned pages</text>

  <line x1="690" y1="328" x2="690" y2="229" stroke="#555" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arwd)"/>
  <text x="698" y="280" font-size="10" fill="#555">weighed, not trusted</text>
  <rect x="615" y="328" width="150" height="60" rx="2" fill="#ffffff" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="690" y="352" text-anchor="middle" font-size="12.5" fill="#111">Spike, QEMU, RTL</text>
  <text x="690" y="369" text-anchor="middle" font-size="10.5" fill="#333">evidence, never truth</text>
</svg>
